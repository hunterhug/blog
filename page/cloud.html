<div id='content' class="container-fluid" style="text-align: center">
    <div class="row-fluid">
        <div class="span12">
        </div>
    </div>
    <div class="row-fluid">
        <link href="https://hunterhug.github.io/blog/static/css/unical.css" rel="stylesheet"/>
        <div style="width:400px;background:#f4f4f4;margin:30px auto;border: 1px solid #ddd;border-radius: 4px;">
            <table cellpadding="0" cellspacing="0" id="CalendarTab" style="text-align: center;">
                <tr>
                    <td>
                        <div id="cal">
                            <div id="top">
                                公元 <select></select> 年 <select></select> 月 农历<span></span> 年 <span></span>年
                                <input type="button" value="回到今天" title="点击后跳转回今天" style="padding:0px">
                            </div>
                            <ul id="wk">
                                <li>一</li>
                                <li>二</li>
                                <li>三</li>
                                <li>四</li>
                                <li>五</li>
                                <li><b>六</b></li>
                                <li><b>日</b></li>
                            </ul>
                            <div id="cm"></div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
        <div>
            <link rel="stylesheet" href="https://hunterhug.github.io/blog/static/css/time.css"/>
            <script src="https://hunterhug.github.io/blog/static/js/time.js"></script>

            <div id="hoverclock" style="margin: 0 auto"></div>
            <script>
                $("#hoverclock").hoverclock({});
            </script>
        </div>
        <script type="text/javascript" src="https://hunterhug.github.io/blog/static/js/unical.js"></script>
    </div>
</div>
